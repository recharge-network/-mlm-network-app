<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // 🔹 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser;

    // 🔹 Auth Guard (Only Admin)
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        currentUser = user;
        const snap = await getDocs(collection(db, "users"));
        let isAdmin = false;
        snap.forEach(d => {
          if (d.id === user.uid && d.data().role === "admin") {
            isAdmin = true;
          }
        });
        if (!isAdmin) {
          alert("❌ Access Denied. Admins only.");
          window.location.href = "index.html";
        } else {
          loadUsers();
        }
      }
    });

    // 🔹 Load Users List
    async function loadUsers() {
      const tbody = document.getElementById("usersTable");
      tbody.innerHTML = `<tr><td colspan="5" class="p-2 text-center">Loading...</td></tr>`;
      const snaps = await getDocs(collection(db, "users"));
      tbody.innerHTML = "";
      snaps.forEach(docSnap => {
        const u = docSnap.data();
        const row = `
          <tr class="border-b">
            <td class="p-2">${u.name || "N/A"}</td>
            <td class="p-2">${u.email || ""}</td>
            <td class="p-2">${u.role || "retailer"}</td>
            <td class="p-2">₹${u.balance || 0}</td>
            <td class="p-2">
              <button class="bg-green-600 text-white px-2 py-1 rounded text-xs" onclick="updateBalance('${docSnap.id}', 100)">+100</button>
              <button class="bg-red-600 text-white px-2 py-1 rounded text-xs" onclick="updateBalance('${docSnap.id}', -100)">-100</button>
              <select onchange="updateRole('${docSnap.id}', this.value)" class="border p-1 text-xs">
                <option value="retailer" ${u.role==="retailer"?"selected":""}>Retailer</option>
                <option value="distributor" ${u.role==="distributor"?"selected":""}>Distributor</option>
                <option value="master" ${u.role==="master"?"selected":""}>Master Distributor</option>
                <option value="admin" ${u.role==="admin"?"selected":""}>Admin</option>
              </select>
            </td>
          </tr>`;
        tbody.insertAdjacentHTML("beforeend", row);
      });
    }

    // 🔹 Update Balance
    window.updateBalance = async (uid, amount) => {
      await updateDoc(doc(db, "users", uid), { balance: increment(amount) });
      loadUsers();
    }

    // 🔹 Update Role
    window.updateRole = async (uid, role) => {
      await updateDoc(doc(db, "users", uid), { role });
      loadUsers();
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">Admin Panel</h1>
    <div class="bg-white shadow-md rounded-lg p-4">
      <table class="w-full text-sm">
        <thead class="bg-gray-200">
          <tr>
            <th class="p-2 text-left">Name</th>
            <th class="p-2 text-left">Email</th>
            <th class="p-2 text-left">Role</th>
            <th class="p-2 text-left">Balance</th>
            <th class="p-2 text-left">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTable"></tbody>
      </table>
    </div>
    <p class="mt-4 text-sm text-center"><a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a></p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // 🔹 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser;

    // 🔹 Auth Guard (sirf admin allow)
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        currentUser = user;

        // 🔹 Yahan simple check kiya hai: agar email == admin ka email hai to hi access
        if (user.email !== "admin@example.com") {
          alert("❌ You are not authorized to access Admin Panel!");
          window.location.href = "index.html";
        } else {
          loadUsers();
        }
      }
    });

    // 🔹 Load Users
    async function loadUsers() {
      const tbody = document.getElementById("userTable");
      tbody.innerHTML = "<tr><td colspan='4' class='p-2 text-center'>Loading...</td></tr>";
      const snaps = await getDocs(collection(db, "users"));
      tbody.innerHTML = "";
      snaps.forEach(docSnap => {
        const u = docSnap.data();
        const row = `
          <tr class="border-b">
            <td class="p-2">${u.uid}</td>
            <td class="p-2">${u.name || ""}</td>
            <td class="p-2">${u.email}</td>
            <td class="p-2">₹${u.balance || 0}</td>
          </tr>`;
        tbody.insertAdjacentHTML("beforeend", row);
      });
    }

    // 🔹 Update Balance
    window.updateBalance = async () => {
      const uid = document.getElementById("uid").value.trim();
      const amount = parseFloat(document.getElementById("amount").value);
      if (!uid || isNaN(amount)) {
        document.getElementById("msg").textContent = "⚠️ Please enter UID and amount.";
        return;
      }
      try {
        await updateDoc(doc(db, "users", uid), { balance: increment(amount) });
        document.getElementById("msg").textContent = "✅ Balance updated!";
        loadUsers();
      } catch (err) {
        document.getElementById("msg").textContent = "❌ " + err.message;
      }
    }

    // 🔹 Logout
    window.doLogout = () => signOut(auth);
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-blue-800">Admin Panel</h1>
      <button onclick="doLogout()" class="bg-red-500 text-white px-4 py-2 rounded-lg">Logout</button>
    </div>

    <div class="bg-white shadow-md rounded-lg p-4 mb-6">
      <h2 class="text-lg font-semibold mb-2">Update User Balance</h2>
      <input id="uid" type="text" placeholder="User UID" class="w-full border p-2 rounded mb-2"/>
      <input id="amount" type="number" placeholder="Amount (+/-)" class="w-full border p-2 rounded mb-2"/>
      <button onclick="updateBalance()" class="w-full bg-blue-600 text-white p-2 rounded">Update Balance</button>
      <p id="msg" class="text-sm mt-2"></p>
    </div>

    <div class="bg-white shadow-md rounded-lg overflow-hidden">
      <h2 class="text-lg font-semibold p-4 border-b">All Users</h2>
      <table class="w-full text-sm">
        <thead class="bg-gray-200">
          <tr>
            <th class="p-2 text-left">UID</th>
            <th class="p-2 text-left">Name</th>
            <th class="p-2 text-left">Email</th>
            <th class="p-2 text-left">Balance</th>
          </tr>
        </thead>
        <tbody id="userTable"></tbody>
      </table>
    </div>

    <p class="mt-4 text-sm text-center"><a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a></p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, increment, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // 🔗 Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let adminUID = "PUT_ADMIN_UID_HERE"; // 👈 यहां अपने admin का UID डालना है (Firebase Console → Authentication से)

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = "login.html";
      if (user.uid !== adminUID) return window.location.href = "index.html"; // not admin
      document.getElementById("welcome").textContent = "👑 Welcome Admin (" + user.email + ")";
      loadUsers();
    });

    // सभी users लोड करो
    async function loadUsers() {
      const tbody = document.getElementById("userBody");
      tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center">Loading...</td></tr>`;
      const snap = await getDocs(collection(db, "users"));
      tbody.innerHTML = "";
      snap.forEach(docu => {
        const d = docu.data();
        tbody.innerHTML += `
          <tr>
            <td class="border p-2">${d.name || d.email || "N/A"}</td>
            <td class="border p-2">${d.email || ""}</td>
            <td class="border p-2">₹ ${(d.balance || 0).toFixed(2)}</td>
            <td class="border p-2">
              <input id="amt_${docu.id}" type="number" placeholder="Amount" class="border p-1 w-24"/>
              <button onclick="addMoney('${docu.id}')" class="bg-green-600 text-white px-2 py-1 rounded">Add</button>
              <button onclick="viewLedger('${docu.id}')" class="bg-blue-600 text-white px-2 py-1 rounded">Ledger</button>
            </td>
          </tr>`;
      });
    }

    // Add Money function
    window.addMoney = async (uid) => {
      const amount = parseFloat(document.getElementById("amt_" + uid).value);
      if (isNaN(amount) || amount <= 0) return alert("⚠️ Enter valid amount");
      try {
        await updateDoc(doc(db, "users", uid), { balance: increment(amount) });
        await addDoc(collection(db, "users", uid, "ledger"), {
          type: "Credit",
          amount,
          note: "Admin Top-up",
          status: "Success",
          ts: serverTimestamp()
        });
        alert("✅ Balance added!");
        loadUsers();
      } catch (e) {
        alert("❌ " + e.message);
      }
    };

    // Ledger देखना
    window.viewLedger = async (uid) => {
      localStorage.setItem("ledgerUser", uid);
      window.location.href = "transactions.html";
    };
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-red-700 mb-4">👑 Admin Panel</h1>
    <p id="welcome" class="mb-4 text-gray-700"></p>

    <div class="bg-white shadow rounded overflow-hidden">
      <table class="w-full border-collapse">
        <thead class="bg-gray-200">
          <tr>
            <th class="border p-2">Name</th>
            <th class="border p-2">Email</th>
            <th class="border p-2">Balance</th>
            <th class="border p-2">Actions</th>
          </tr>
        </thead>
        <tbody id="userBody"></tbody>
      </table>
    </div>

    <p class="mt-4 text-sm text-center">
      <a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a>
    </p>
  </div>
</body>
</html>

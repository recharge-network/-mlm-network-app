<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AEPS Service</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // 🔹 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser;

    // 🔹 Auth Guard
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        currentUser = user;
      }
    });

    // 🔹 AEPS Transaction Function
    window.doAepsTxn = async () => {
      const aadhaar = document.getElementById("aadhaar").value.trim();
      const bank = document.getElementById("bank").value.trim();
      const txnType = document.getElementById("txnType").value;
      const amount = parseFloat(document.getElementById("amount").value);

      if (!aadhaar || !bank || !txnType || (txnType !== "balance" && (isNaN(amount) || amount <= 0))) {
        document.getElementById("msg").textContent = "⚠️ Please fill all fields correctly.";
        return;
      }

      try {
        const userRef = doc(db, "users", currentUser.uid);
        const snap = await getDoc(userRef);

        if (!snap.exists()) {
          document.getElementById("msg").textContent = "❌ User not found.";
          return;
        }

        // Balance update only if cash withdraw/deposit
        if (txnType === "withdraw" || txnType === "deposit") {
          const bal = snap.data().balance || 0;
          if (txnType === "withdraw" && bal < amount) {
            document.getElementById("msg").textContent = "❌ Insufficient balance.";
            return;
          }
          await updateDoc(userRef, {
            balance: increment(txnType === "withdraw" ? -amount : amount)
          });
        }

        // Ledger entry
        await addDoc(collection(db, "users", currentUser.uid, "ledger"), {
          type: txnType === "withdraw" ? "debit" : txnType === "deposit" ? "credit" : "info",
          amount: txnType === "balance" ? 0 : amount,
          note: `AEPS ${txnType.toUpperCase()} | Aadhaar: ${aadhaar}, Bank: ${bank}`,
          ts: serverTimestamp()
        });

        document.getElementById("msg").textContent = `✅ AEPS ${txnType} request submitted.`;
      } catch (err) {
        document.getElementById("msg").textContent = "❌ " + err.message;
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">AEPS Service</h1>
    <div class="bg-white shadow-md rounded-lg p-4">
      <input id="aadhaar" type="text" maxlength="12" placeholder="Aadhaar Number" class="w-full border p-2 rounded mb-2"/>
      <input id="bank" type="text" placeholder="Bank Name" class="w-full border p-2 rounded mb-2"/>
      <select id="txnType" class="w-full border p-2 rounded mb-2">
        <option value="">Select Transaction Type</option>
        <option value="balance">Balance Enquiry</option>
        <option value="withdraw">Cash Withdraw</option>
        <option value="deposit">Cash Deposit</option>
        <option value="mini">Mini Statement</option>
      </select>
      <input id="amount" type="number" placeholder="Amount (Only for withdraw/deposit)" class="w-full border p-2 rounded mb-2"/>
      <button onclick="doAepsTxn()" class="w-full bg-blue-600 text-white p-2 rounded">Submit AEPS Request</button>
      <p id="msg" class="text-sm mt-2"></p>
    </div>
    <p class="mt-4 text-sm text-center"><a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a></p>
  </div>
</body>
</html>

<!-- aeps.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AEPS Service</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-100">

  <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-bold mb-4 text-center text-blue-700">AEPS Transaction</h2>

    <form id="aepsForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Aadhaar Number</label>
        <input type="text" name="aadhaar" maxlength="12" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Enter Aadhaar number" required />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Bank Name</label>
        <input type="text" name="bank" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Enter bank name" required />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Transaction Type</label>
        <select name="type" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>
          <option value="">Select Type</option>
          <option value="balance">Balance Enquiry</option>
          <option value="withdrawal">Cash Withdrawal</option>
          <option value="statement">Mini Statement</option>
        </select>
      </div>

      <div id="amountField" style="display: none;">
        <label class="block text-sm font-medium text-gray-700">Amount (₹)</label>
        <input type="number" name="amount" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Enter amount (if applicable)" />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Submit</button>
    </form>

    <p id="message" class="text-center text-green-600 mt-4 hidden">AEPS transaction request submitted!</p>
  </div>

  <script>
    const typeSelect = document.querySelector("select[name='type']");
    const amountField = document.getElementById("amountField");

    typeSelect.addEventListener("change", function() {
      if (this.value === "withdrawal") {
        amountField.style.display = "block";
      } else {
        amountField.style.display = "none";
      }
    });

    document.getElementById('aepsForm').addEventListener('submit', function(e) {
      e.preventDefault();
      // Normally API call here
      document.getElementById('message').classList.remove('hidden');
    });
  </script>
</body>
</html>

<!-- cashdeposit.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cash Deposit</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-100">

  <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-bold mb-4 text-center text-blue-700">Cash Deposit</h2>

    <form id="cashForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Customer Name</label>
        <input type="text" name="name" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Enter customer name" required />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Account Number</label>
        <input type="text" name="account" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Enter account number" required />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Deposit Amount</label>
        <input type="number" name="amount" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Enter amount (₹)" required />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Submit Deposit</button>
    </form>

    <p id="message" class="text-center text-green-600 mt-4 hidden">Cash deposit submitted successfully!</p>
  </div>

  <script>
    document.getElementById('cashForm').addEventListener('submit', function(e) {
      e.preventDefault();
      // Normally API call here
      document.getElementById('message').classList.remove('hidden');
    });
  </script>
</body>
</html>

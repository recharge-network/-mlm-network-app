<!-- credit.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Credit Card Application</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-100">

  <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-bold mb-4 text-center text-blue-700">Credit Card Application</h2>

    <form id="creditForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Full Name</label>
        <input type="text" name="fullname" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Enter full name" required />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Mobile Number</label>
        <input type="tel" name="mobile" maxlength="10" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Enter mobile number" required />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Income Type</label>
        <select name="income" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>
          <option value="">Select</option>
          <option value="salaried">Salaried</option>
          <option value="self">Self-Employed</option>
          <option value="student">Student</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Apply Card</button>
    </form>

    <p id="message" class="text-center text-green-600 mt-4 hidden">Credit card application submitted!</p>
  </div>

  <script>
    document.getElementById('creditForm').addEventListener('submit', function(e) {
      e.preventDefault();
      // Normally API call here
      document.getElementById('message').classList.remove('hidden');
    });
  </script>
</body>
</html>

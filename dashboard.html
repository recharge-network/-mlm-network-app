<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - MLM</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }
    header {
      background: #004080;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h2 {
      margin: 0;
    }
    #logout {
      padding: 6px 14px;
      background: red;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .dashboard {
      max-width: 900px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      text-decoration: none;
      color: black;
      transition: 0.3s;
    }
    .card:hover {
      transform: scale(1.05);
      background: #f0f8ff;
    }
    .icon {
      font-size: 30px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h2>Welcome to Your Dashboard</h2>
    <button id="logout">Logout</button>
  </header>

  <div class="dashboard">
    <a href="services/mobile-recharge.html" class="card">
      <div class="icon">📱</div>
      Mobile Recharge
    </a>
    <a href="services/dth-recharge.html" class="card">
      <div class="icon">📺</div>
      DTH Recharge
    </a>
    <a href="services/money-transfer.html" class="card">
      <div class="icon">💸</div>
      Money Transfer
    </a>
    <a href="services/electricity-bill.html" class="card">
      <div class="icon">💡</div>
      Electric Bill Payment
    </a>
    <a href="services/lpg-booking.html" class="card">
      <div class="icon">🛢</div>
      LPG Booking
    </a>
    <a href="services/network-refer.html" class="card">
      <div class="icon">🔗</div>
      Network Marketing Refer
    </a>
  </div>

  <script>
    // Firebase logout logic
    document.getElementById("logout").addEventListener("click", function() {
      firebase.auth().signOut().then(() => {
        window.location.href = "index.html";
      }).catch((error) => {
        alert("Logout failed: " + error.message);
      });
    });
  </script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.appspot.com",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };
    firebase.initializeApp(firebaseConfig);

    firebase.auth().onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "index.html";
      }
    });
  </script>

</body>
</html>

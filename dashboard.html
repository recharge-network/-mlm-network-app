<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - MLM</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 0;
      background-color: #f0f2f5;
    }
    .top-bar {
      text-align: right;
      padding: 10px 20px;
      background-color: #fff;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .dashboard {
      max-width: 900px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      text-decoration: none;
      color: black;
      transition: 0.3s;
    }
    .card:hover {
      transform: scale(1.05);
      background: #f0f8ff;
    }
    .icon-img {
      width: 50px;
      height: 50px;
      padding: 10px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
      object-fit: contain;
      transition: transform 0.3s;
    }
    .icon-img:hover {
      transform: scale(1.1);
      filter: drop-shadow(0 0 4px #007BFF) drop-shadow(0 0 4px #dc3545);
    }
    #user-email {
      font-size: 14px;
      margin-right: 10px;
      color: green;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <span id="user-email"></span>
    <button onclick="logout()">Logout</button>
  </div>

  <h2 style="text-align:center;">Welcome to Your Dashboard</h2>

  <div class="dashboard">

    <a href="services/recharge.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/3103/3103451.png" class="icon-img" alt="Recharge">
      Recharge
    </a>

    <a href="services/bill-payment.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/3771/3771380.png" class="icon-img" alt="Bill Payment">
      Bill Payment
    </a>

    <a href="services/money-transfer.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/3271/3271334.png" class="icon-img" alt="Money Transfer">
      Money Transfer
    </a>

    <a href="services/dth-recharge.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/747/747310.png" class="icon-img" alt="DTH Recharge">
      DTH Recharge
    </a>

    <a href="services/aeps.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/4762/4762316.png" class="icon-img" alt="AEPS">
      AEPS
    </a>

    <a href="services/credit-card.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/633/633611.png" class="icon-img" alt="Credit Card">
      Credit Card
    </a>

    <a href="services/account-opening.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/2983/2983067.png" class="icon-img" alt="Account Opening">
      Account Opening
    </a>

    <a href="services/balance-enquiry.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/4701/4701522.png" class="icon-img" alt="Balance Enquiry">
      Balance Enquiry
    </a>

    <a href="services/mini-statement.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/2803/2803677.png" class="icon-img" alt="Mini Statement">
      Mini Statement
    </a>

    <a href="services/cash-withdrawal.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/9286/9286958.png" class="icon-img" alt="Cash Withdrawal">
      Cash Withdrawal
    </a>

    <a href="services/cash-deposit.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/9286/9286910.png" class="icon-img" alt="Cash Deposit">
      Cash Deposit
    </a>

    <a href="services/debit-link.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/6229/6229827.png" class="icon-img" alt="Debit Link">
      Debit Link
    </a>

    <a href="services/pan-card.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="icon-img" alt="PAN Card">
      PAN Card
    </a>

    <a href="services/aadhaar-update.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/1055/1055644.png" class="icon-img" alt="Aadhaar Update">
      Aadhaar Update
    </a>

    <a href="services/more-services.html" class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/1828/1828817.png" class="icon-img" alt="More Services">
      More Services
    </a>

  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.appspot.com",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };
    firebase.initializeApp(firebaseConfig);

    firebase.auth().onAuthStateChanged(function(user) {
      if (user) {
        document.getElementById("user-email").innerText = "👤 " + user.email;
      } else {
        window.location.href = "index.html";
      }
    });

    function logout() {
      firebase.auth().signOut().then(() => {
        window.location.href = "index.html";
      });
    }
  </script>

</body>
</html>

<!-- dashboard.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - MLM</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard {
      max-width: 900px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      text-decoration: none;
      color: black;
      transition: 0.3s;
    }
    .card:hover {
      transform: scale(1.05);
      background: #f0f8ff;
    }
    .icon {
      font-size: 30px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h2 style="text-align:center;">Welcome to Your Dashboard</h2>

  <div class="dashboard">
    <a href="services/recharge.html" class="card">
      <div class="icon">🔌</div>
      Recharge
    </a>
    <a href="services/bill-payment.html" class="card">
      <div class="icon">💡</div>
      Bill Payment
    </a>
    <a href="services/money-transfer.html" class="card">
      <div class="icon">💸</div>
      Money Transfer
    </a>
    <a href="services/dth-recharge.html" class="card">
      <div class="icon">📺</div>
      DTH Recharge
    </a>
    <a href="services/aeps.html" class="card">
      <div class="icon">🆔</div>
      AEPS
    </a>
    <a href="services/credit-card.html" class="card">
      <div class="icon">💳</div>
      Credit Card
    </a>
    <a href="services/account-opening.html" class="card">
      <div class="icon">🏦</div>
      Account Opening
    </a>
    <a href="services/balance-enquiry.html" class="card">
      <div class="icon">📊</div>
      Balance Enquiry
    </a>
    <a href="services/mini-statement.html" class="card">
      <div class="icon">📄</div>
      Mini Statement
    </a>
    <a href="services/cash-withdrawal.html" class="card">
      <div class="icon">🏧</div>
      Cash Withdrawal
    </a>
    <a href="services/cash-deposit.html" class="card">
      <div class="icon">💰</div>
      Cash Deposit
    </a>
    <a href="services/debit-link.html" class="card">
      <div class="icon">🔗</div>
      Debit Link
    </a>
    <a href="services/pan-card.html" class="card">
      <div class="icon">🪪</div>
      PAN Card
    </a>
    <a href="services/aadhaar-update.html" class="card">
      <div class="icon">🧾</div>
      Aadhaar Update
    </a>
    <a href="services/more-services.html" class="card">
      <div class="icon">➕</div>
      More Services
    </a>
  </div>

</body>
</html>

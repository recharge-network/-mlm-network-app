<!-- dth.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DTH Recharge</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-100">

  <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-bold mb-4 text-center text-blue-700">DTH Recharge</h2>

    <form id="dthForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">DTH Number / Subscriber ID</label>
        <input type="text" name="subscriber" maxlength="15" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Enter DTH Subscriber ID" required />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Operator</label>
        <select name="operator" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>
          <option value="">Select DTH Operator</option>
          <option value="tatasky">Tata Sky</option>
          <option value="dishtv">Dish TV</option>
          <option value="d2h">d2h</option>
          <option value="airtel">Airtel DTH</option>
          <option value="sun">Sun Direct</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Amount (₹)</label>
        <input type="number" name="amount" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Recharge Now</button>
    </form>

    <p id="message" class="text-center text-green-600 mt-4 hidden">DTH Recharge request submitted!</p>
  </div>

  <script>
    document.getElementById('dthForm').addEventListener('submit', function(e) {
      e.preventDefault();
      // Normally, API call yahan hoti
      document.getElementById('message').classList.remove('hidden');
    });
  </script>
</body>
</html>

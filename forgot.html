<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    // 🔗 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.appspot.com",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.resetPassword = async () => {
      const email = document.getElementById("email").value.trim();
      const msg = document.getElementById("msg");
      msg.textContent = "";

      if (!email) {
        msg.textContent = "⚠️ Please enter your email address";
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        msg.textContent = "✅ Password reset email sent! Check your inbox.";
        msg.classList.remove("text-red-600");
        msg.classList.add("text-green-600");
      } catch (e) {
        msg.textContent = "❌ " + e.message;
        msg.classList.remove("text-green-600");
        msg.classList.add("text-red-600");
      }
    };
  </script>
</head>
<body class="bg-gradient-to-r from-pink-500 to-red-600 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-red-700 mb-6">🔄 Reset Password</h1>
    
    <input id="email" type="email" placeholder="Enter your registered email" class="w-full border p-2 rounded mb-3"/>
    
    <button onclick="resetPassword()" class="w-full bg-red-600 text-white py-2 rounded hover:bg-red-700">Send Reset Link</button>
    <p id="msg" class="text-sm mt-3 text-center"></p>
    
    <p class="mt-4 text-sm text-center">
      <a href="login.html" class="text-red-600">⬅ Back to Login</a>
    </p>
  </div>
</body>
</html>

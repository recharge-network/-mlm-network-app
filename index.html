<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - All Services</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    // 🔹 Aapka Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 🔹 Auth Guard
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        document.getElementById("userEmail").textContent = user.email;
      }
    });

    // 🔹 Logout
    window.doLogout = () => signOut(auth);
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-blue-800">All Services</h1>
      <div class="flex items-center gap-4">
        <span id="userEmail" class="text-sm text-gray-700"></span>
        <button onclick="doLogout()" class="bg-red-500 text-white px-4 py-2 rounded-lg">Logout</button>
      </div>
    </div>

    <div class="flex flex-wrap -mx-2 justify-center">
      <div class="w-1/2 sm:w-1/3 md:w-1/4 lg:w-1/5 p-2">
        <a href="recharge.html">
          <div class="bg-white rounded-xl shadow-md flex flex-col items-center p-4 hover:bg-blue-100">
            <img src="https://cdn-icons-png.flaticon.com/512/1040/1040230.png" class="w-16 h-16 mb-2" />
            <p class="text-center text-sm font-semibold text-blue-600">Mobile Recharge</p>
          </div>
        </a>
      </div>

      <div class="w-1/2 sm:w-1/3 md:w-1/4 lg:w-1/5 p-2">
        <a href="dth.html">
          <div class="bg-white rounded-xl shadow-md flex flex-col items-center p-4 hover:bg-blue-100">
            <img src="https://cdn-icons-png.flaticon.com/512/1682/1682130.png" class="w-16 h-16 mb-2" />
            <p class="text-center text-sm font-semibold text-blue-600">DTH Recharge</p>
          </div>
        </a>
      </div>

      <div class="w-1/2 sm:w-1/3 md:w-1/4 lg:w-1/5 p-2">
        <a href="bill.html">
          <div class="bg-white rounded-xl shadow-md flex flex-col items-center p-4 hover:bg-blue-100">
            <img src="https://cdn-icons-png.flaticon.com/512/2920/2920290.png" class="w-16 h-16 mb-2" />
            <p class="text-center text-sm font-semibold text-blue-600">Bill Payment</p>
          </div>
        </a>
      </div>

      <div class="w-1/2 sm:w-1/3 md:w-1/4 lg:w-1/5 p-2">
        <a href="money.html">
          <div class="bg-white rounded-xl shadow-md flex flex-col items-center p-4 hover:bg-blue-100">
            <img src="https://cdn-icons-png.flaticon.com/512/3183/3183273.png" class="w-16 h-16 mb-2" />
            <p class="text-center text-sm font-semibold text-blue-600">Money Transfer</p>
          </div>
        </a>
      </div>

      <div class="w-1/2 sm:w-1/3 md:w-1/4 lg:w-1/5 p-2">
        <a href="aeps.html">
          <div class="bg-white rounded-xl shadow-md flex flex-col items-center p-4 hover:bg-blue-100">
            <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" class="w-16 h-16 mb-2" />
            <p class="text-center text-sm font-semibold text-blue-600">AEPS</p>
          </div>
        </a>
      </div>

      <!-- Aur bhi services same pattern se add kiye gaye (balance, statement, withdraw, etc.) -->
      <!-- aap chahe to poore 15-20 service icons yahan copy kar sakte ho -->
    </div>
  </div>
</body>
</html>

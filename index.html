<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    // ✅ आपका Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // check login
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        document.getElementById("welcome").textContent = "👋 Welcome, " + (user.email || "");
      }
    });

    // logout
    window.doLogout = async () => {
      await signOut(auth);
      window.location.href = "login.html";
    };
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-blue-800">📱 My Dashboard</h1>
      <button onclick="doLogout()" class="bg-red-600 text-white px-4 py-2 rounded">Logout</button>
    </div>
    <p id="welcome" class="mb-4 text-gray-600"></p>

    <!-- Services Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">

      <!-- Wallet -->
      <a href="wallet.html" class="bg-white shadow-md rounded-lg p-4 flex flex-col items-center hover:bg-blue-50">
        <span class="text-3xl">💰</span>
        <p class="mt-2 font-semibold">Wallet</p>
      </a>

      <!-- Ledger -->
      <a href="ledger.html" class="bg-white shadow-md rounded-lg p-4 flex flex-col items-center hover:bg-blue-50">
        <span class="text-3xl">📒</span>
        <p class="mt-2 font-semibold">Ledger</p>
      </a>

      <!-- Profile -->
      <a href="profile.html" class="bg-white shadow-md rounded-lg p-4 flex flex-col items-center hover:bg-blue-50">
        <span class="text-3xl">👤</span>
        <p class="mt-2 font-semibold">Profile</p>
      </a>

      <!-- PAN Card -->
      <a href="pan.html" class="bg-white shadow-md rounded-lg p-4 flex flex-col items-center hover:bg-blue-50">
        <span class="text-3xl">🪪</span>
        <p class="mt-2 font-semibold">PAN Card</p>
      </a>

      <!-- Recharge -->
      <a href="recharge.html" class="bg-white shadow-md rounded-lg p-4 flex flex-col items-center hover:bg-blue-50">
        <span class="text-3xl">📱</span>
        <p class="mt-2 font-semibold">Recharge</p>
      </a>

      <!-- Bill Payment -->
      <a href="bill.html" class="bg-white shadow-md rounded-lg p-4 flex flex-col items-center hover:bg-blue-50">
        <span class="text-3xl">🧾</span>
        <p class="mt-2 font-semibold">Bill Payment</p>
      </a>

      <!-- DTH -->
      <a href="dth.html" class="bg-white shadow-md rounded-lg p-4 flex flex-col items-center hover:bg-blue-50">
        <span class="text-3xl">📺</span>
        <p class="mt-2 font-semibold">DTH</p>
      </a>

      <!-- AEPS -->
      <a href="aeps.html" class="bg-white shadow-md rounded-lg p-4 flex flex-col items-center hover:bg-blue-50">
        <span class="text-3xl">🆔</span>
        <p class="mt-2 font-semibold">AEPS</p>
      </a>

      <!-- Money Transfer -->
      <a href="money.html" class="bg-white shadow-md rounded-lg p-4 flex flex-col items-center hover:bg-blue-50">
        <span class="text-3xl">🏦</span>
        <p class="mt-2 font-semibold">Money Transfer</p>
      </a>

    </div>
  </div>
</body>
</html>

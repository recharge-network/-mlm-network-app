<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transaction History</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // 🔹 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser;

    // 🔹 Auth Guard
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        currentUser = user;
        loadLedger();
      }
    });

    // 🔹 Load Ledger Entries
    async function loadLedger() {
      const tbody = document.getElementById("ledgerTable");
      tbody.innerHTML = `<tr><td colspan="4" class="p-2 text-center">Loading...</td></tr>`;
      const q = query(collection(db, "users", currentUser.uid, "ledger"), orderBy("ts", "desc"));
      const snaps = await getDocs(q);
      tbody.innerHTML = "";
      snaps.forEach(docSnap => {
        const txn = docSnap.data();
        const date = txn.ts?.toDate().toLocaleString() || "";
        const row = `
          <tr class="border-b">
            <td class="p-2">${date}</td>
            <td class="p-2">${txn.note || ""}</td>
            <td class="p-2 ${txn.type === 'debit' ? 'text-red-600' : txn.type === 'credit' ? 'text-green-600' : ''}">
              ${txn.type === 'debit' ? "-" : txn.type === 'credit' ? "+" : ""} ₹${txn.amount}
            </td>
            <td class="p-2">${txn.type.toUpperCase()}</td>
          </tr>`;
        tbody.insertAdjacentHTML("beforeend", row);
      });
      if (tbody.innerHTML === "") {
        tbody.innerHTML = `<tr><td colspan="4" class="p-2 text-center">No transactions found.</td></tr>`;
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">Transaction History</h1>
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-200">
          <tr>
            <th class="p-2 text-left">Date</th>
            <th class="p-2 text-left">Details</th>
            <th class="p-2 text-left">Amount</th>
            <th class="p-2 text-left">Type</th>
          </tr>
        </thead>
        <tbody id="ledgerTable"></tbody>
      </table>
    </div>
    <p class="mt-4 text-sm text-center"><a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a></p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Ledger</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // ✅ आपका Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        loadLedger(user.uid);
      }
    });

    async function loadLedger(uid) {
      const table = document.getElementById("ledgerBody");
      table.innerHTML = "<tr><td colspan='5' class='text-center p-2'>Loading...</td></tr>";
      try {
        const q = query(collection(db, "users", uid, "ledger"), orderBy("ts", "desc"));
        const snap = await getDocs(q);
        table.innerHTML = "";
        if (snap.empty) {
          table.innerHTML = "<tr><td colspan='5' class='text-center p-2'>No transactions found</td></tr>";
        } else {
          snap.forEach(doc => {
            const d = doc.data();
            const date = d.ts?.toDate().toLocaleString() || "";
            table.innerHTML += `
              <tr>
                <td class="border p-2">${date}</td>
                <td class="border p-2">${d.type || ""}</td>
                <td class="border p-2">${d.amount || 0}</td>
                <td class="border p-2">${d.note || ""}</td>
                <td class="border p-2">${d.status || "Success"}</td>
              </tr>`;
          });
        }
      } catch (e) {
        table.innerHTML = "<tr><td colspan='5' class='text-red-600 p-2'>Error: " + e.message + "</td></tr>";
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">📒 My Ledger</h1>
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
      <table class="w-full border-collapse">
        <thead class="bg-gray-200">
          <tr>
            <th class="border p-2">Date</th>
            <th class="border p-2">Type</th>
            <th class="border p-2">Amount</th>
            <th class="border p-2">Note</th>
            <th class="border p-2">Status</th>
          </tr>
        </thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </div>
    <p class="mt-4 text-sm text-center"><a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a></p>
  </div>
</body>
</html>

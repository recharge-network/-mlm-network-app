<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    // 🔹 Aapka Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 🔹 Login Function
    window.doLogin = async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "index.html"; // login ke baad dashboard
      } catch (err) {
        document.getElementById("msg").textContent = err.message;
      }
    }

    // 🔹 Forgot Password
    window.doReset = async () => {
      const email = document.getElementById("email").value;
      if (!email) {
        document.getElementById("msg").textContent = "Please enter your email first.";
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        document.getElementById("msg").textContent = "Password reset link sent to " + email;
      } catch (err) {
        document.getElementById("msg").textContent = err.message;
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-sm">
    <h2 class="text-xl font-bold text-center mb-4">Login</h2>
    <input id="email" type="email" placeholder="Email" class="w-full border p-2 rounded mb-2" />
    <input id="password" type="password" placeholder="Password" class="w-full border p-2 rounded mb-2" />
    <button onclick="doLogin()" class="w-full bg-blue-600 text-white p-2 rounded">Login</button>
    <button onclick="doReset()" class="w-full bg-gray-200 text-blue-700 p-2 rounded mt-2">Forgot Password?</button>
    <p id="msg" class="text-red-500 text-sm mt-2"></p>
    <p class="mt-4 text-sm text-center">New user? <a href="signup.html" class="text-blue-600">Sign up</a></p>
  </div>
</body>
</html>

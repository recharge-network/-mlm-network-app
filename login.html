<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    // 🔗 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.appspot.com",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");
      msg.textContent = "";

      if (!email || !password) {
        msg.textContent = "⚠️ Please enter email and password";
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
        msg.textContent = "✅ Login successful! Redirecting...";
        setTimeout(() => window.location.href = "index.html", 1500);
      } catch (e) {
        msg.textContent = "❌ " + e.message;
      }
    };
  </script>
</head>
<body class="bg-gradient-to-r from-purple-600 to-indigo-600 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-indigo-700 mb-6">🔑 Login</h1>
    
    <input id="email" type="email" placeholder="Email" class="w-full border p-2 rounded mb-3"/>
    <input id="password" type="password" placeholder="Password" class="w-full border p-2 rounded mb-3"/>
    
    <button onclick="login()" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Login</button>
    <p id="msg" class="text-sm mt-3 text-center text-red-600"></p>
    
    <p class="mt-4 text-sm text-center">
      Don’t have an account? <a href="signup.html" class="text-indigo-600">Sign Up</a>
    </p>
    <p class="mt-2 text-sm text-center">
      <a href="forgot.html" class="text-indigo-600">Forgot Password?</a>
    </p>
  </div>
</body>
</html>

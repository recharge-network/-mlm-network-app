<!DOCTYPE html>
<html>
<head>
  <title>Mobile Recharge</title>
  <style>
    body {
      font-family: Arial;
      background: #f8f8f8;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select, button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007bff;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Mobile Recharge</h2>
    <form onsubmit="handleRecharge(event)">
      <label>Mobile Number</label>
      <input type="tel" required placeholder="Enter Mobile Number">

      <label>Operator</label>
      <select required>
        <option value="">-- Select Operator --</option>
        <option>Jio</option>
        <option>Airtel</option>
        <option>Vi</option>
        <option>BSNL</option>
      </select>

      <label>Amount</label>
      <input type="number" required placeholder="Enter Amount">

      <button type="submit">Recharge Now</button>
    </form>
  </div>

  <script>
    function handleRecharge(event) {
      event.preventDefault();
      alert(\"✅ Recharge request submitted! (Backend API connect karna baaki hai)\");
    }
  </script>

</body>
</html>

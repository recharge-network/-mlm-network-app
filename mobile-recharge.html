<!-- services/recharge.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Recharge - MLM</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .container {
      max-width: 500px;
      margin: 60px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
    }
    button {
      background-color: blue;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Mobile Recharge</h2>
    
    <label>Mobile Number</label>
    <input type="text" placeholder="Enter mobile number" />

    <label>Operator</label>
    <select>
      <option>Jio</option>
      <option>Airtel</option>
      <option>Vi</option>
      <option>BSNL</option>
    </select>

    <label>Amount</label>
    <input type="number" placeholder="Enter amount" />

    <button>Recharge Now</button>
  </div>

</body>
</html>

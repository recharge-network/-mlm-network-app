<!-- money.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Money Transfer</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-100">

  <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-bold mb-4 text-center text-blue-700">Money Transfer</h2>

    <form id="moneyForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Sender Mobile Number</label>
        <input type="text" name="sender" maxlength="10" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Enter sender mobile" required />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Recipient Account Number</label>
        <input type="text" name="account" maxlength="20" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Enter account number" required />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">IFSC Code</label>
        <input type="text" name="ifsc" maxlength="11" class="mt-1 block w-full border border-gray-300 rounded-md p-2 uppercase" placeholder="Enter IFSC code" required />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Amount (₹)</label>
        <input type="number" name="amount" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Enter amount" required />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Transfer Now</button>
    </form>

    <p id="message" class="text-center text-green-600 mt-4 hidden">Money transfer request submitted!</p>
  </div>

  <script>
    document.getElementById('moneyForm').addEventListener('submit', function(e) {
      e.preventDefault();
      // Normally API call here
      document.getElementById('message').classList.remove('hidden');
    });
  </script>
</body>
</html>

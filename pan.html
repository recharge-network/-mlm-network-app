<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PAN Card Service</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser;

    onAuthStateChanged(auth, (user) => {
      if (!user) return (window.location.href = "login.html");
      currentUser = user;
    });

    window.submitPAN = async () => {
      const fullName = document.getElementById("fullName").value.trim();
      const dob = document.getElementById("dob").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const msg = document.getElementById("msg");
      msg.textContent = "";

      if (!fullName || !dob || !mobile) {
        msg.textContent = "⚠️ Please fill all fields.";
        return;
      }

      try {
        await addDoc(collection(db, "pan_requests"), {
          uid: currentUser.uid,
          fullName, dob, mobile,
          status: "Pending",
          ts: serverTimestamp()
        });
        msg.textContent = "✅ PAN request submitted (demo).";
        document.getElementById("panForm").reset();
      } catch (e) {
        msg.textContent = "❌ " + e.message;
      }
    };
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">🪪 PAN Card Service</h1>
    <div class="bg-white shadow rounded p-4">
      <form id="panForm" onsubmit="event.preventDefault(); submitPAN();">
        <input id="fullName" class="w-full border p-2 rounded mb-2" placeholder="Full Name"/>
        <input id="dob" type="date" class="w-full border p-2 rounded mb-2" placeholder="DOB"/>
        <input id="mobile" type="tel" class="w-full border p-2 rounded mb-2" placeholder="Mobile"/>
        <button class="w-full bg-blue-600 text-white p-2 rounded">Submit Request</button>
      </form>
      <p id="msg" class="text-sm mt-2"></p>
    </div>
    <p class="mt-4 text-sm text-center"><a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a></p>
  </div>
</body>
</html>

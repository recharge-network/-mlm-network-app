<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-storage.js";

    // 🔗 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.appspot.com",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentUser;

    onAuthStateChanged(auth, async (user) => {
      if (!user) return (window.location.href = "login.html");
      currentUser = user;
      loadProfile();
    });

    // 🔹 Load Profile Data
    async function loadProfile() {
      const snap = await getDoc(doc(db, "users", currentUser.uid));
      if (snap.exists()) {
        const data = snap.data();
        document.getElementById("name").value = data.name || "";
        document.getElementById("phone").value = data.phone || "";
        if (data.photoURL) document.getElementById("profilePic").src = data.photoURL;
        if (data.qrURL) document.getElementById("qrPreview").src = data.qrURL;
      }
      document.getElementById("email").value = currentUser.email;
    }

    // 🔹 Save Profile Info
    window.saveProfile = async () => {
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      await updateDoc(doc(db, "users", currentUser.uid), { name, phone });
      alert("✅ Profile Updated!");
    };

    // 🔹 Upload Profile Picture
    window.uploadPhoto = async () => {
      const file = document.getElementById("photo").files[0];
      if (!file) return alert("⚠️ Please select a photo");
      const storageRef = ref(storage, `profiles/${currentUser.uid}/photo.jpg`);
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);
      await updateDoc(doc(db, "users", currentUser.uid), { photoURL: url });
      document.getElementById("profilePic").src = url;
      alert("✅ Profile Photo Updated!");
    };

    // 🔹 Upload QR Code
    window.uploadQR = async () => {
      const file = document.getElementById("qr").files[0];
      if (!file) return alert("⚠️ Please select a QR code image");
      const storageRef = ref(storage, `profiles/${currentUser.uid}/qr.png`);
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);
      await updateDoc(doc(db, "users", currentUser.uid), { qrURL: url });
      document.getElementById("qrPreview").src = url;
      alert("✅ QR Code Uploaded!");
    };
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-lg mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">👤 My Profile</h1>

    <!-- Profile Picture -->
    <div class="bg-white shadow rounded p-4 mb-4 text-center">
      <img id="profilePic" src="https://via.placeholder.com/100" class="mx-auto rounded-full w-24 h-24 mb-2"/>
      <input id="photo" type="file" accept="image/*" class="mb-2"/>
      <button onclick="uploadPhoto()" class="bg-blue-600 text-white px-3 py-1 rounded">Upload Photo</button>
    </div>

    <!-- Profile Form -->
    <div class="bg-white shadow rounded p-4 mb-4">
      <label class="block font-semibold">Name</label>
      <input id="name" type="text" class="w-full border p-2 rounded mb-2"/>

      <label class="block font-semibold">Email</label>
      <input id="email" type="text" disabled class="w-full border p-2 rounded mb-2 bg-gray-100"/>

      <label class="block font-semibold">Phone</label>
      <input id="phone" type="text" class="w-full border p-2 rounded mb-2"/>

      <button onclick="saveProfile()" class="w-full bg-green-600 text-white p-2 rounded">Save Profile</button>
    </div>

    <!-- QR Upload -->
    <div class="bg-white shadow rounded p-4 mb-4 text-center">
      <h2 class="text-lg font-bold mb-2">📱 UPI QR Code</h2>
      <img id="qrPreview" src="https://via.placeholder.com/150" class="mx-auto w-32 h-32 mb-2"/>
      <input id="qr" type="file" accept="image/*" class="mb-2"/>
      <button onclick="uploadQR()" class="bg-purple-600 text-white px-3 py-1 rounded">Upload QR</button>
    </div>

    <!-- Back -->
    <p class="mt-4 text-sm text-center">
      <a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a>
    </p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-storage.js";

    // 🔹 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentUser;

    // 🔹 Auth Guard
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        currentUser = user;
        loadProfile();
      }
    });

    // 🔹 Load Profile Data
    async function loadProfile() {
      const snap = await getDoc(doc(db, "users", currentUser.uid));
      if (snap.exists()) {
        const data = snap.data();
        document.getElementById("name").value = data.name || "";
        document.getElementById("mobile").value = data.mobile || "";
        document.getElementById("email").value = currentUser.email;
        if (data.photoURL) document.getElementById("profileImg").src = data.photoURL;
        if (data.qrURL) document.getElementById("qrImg").src = data.qrURL;
        if (data.bannerURL) document.getElementById("bannerImg").src = data.bannerURL;
      }
    }

    // 🔹 Save Profile
    window.saveProfile = async () => {
      const name = document.getElementById("name").value.trim();
      const mobile = document.getElementById("mobile").value.trim();

      await updateDoc(doc(db, "users", currentUser.uid), {
        name, mobile
      });

      document.getElementById("msg").textContent = "✅ Profile updated successfully.";
    }

    // 🔹 Upload Image (Profile/QR/Banner)
    async function uploadFile(inputId, field, imgId) {
      const file = document.getElementById(inputId).files[0];
      if (!file) return;
      const fileRef = ref(storage, `${currentUser.uid}/${field}.jpg`);
      await uploadBytes(fileRef, file);
      const url = await getDownloadURL(fileRef);
      await updateDoc(doc(db, "users", currentUser.uid), { [field]: url });
      document.getElementById(imgId).src = url;
      document.getElementById("msg").textContent = `✅ ${field} uploaded successfully.`;
    }

    window.uploadProfile = () => uploadFile("profileFile", "photoURL", "profileImg");
    window.uploadQR = () => uploadFile("qrFile", "qrURL", "qrImg");
    window.uploadBanner = () => uploadFile("bannerFile", "bannerURL", "bannerImg");
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-lg mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">My Profile</h1>
    <div class="bg-white shadow-md rounded-lg p-4 mb-4">
      <label class="block mb-2">Full Name</label>
      <input id="name" type="text" class="w-full border p-2 rounded mb-2"/>
      <label class="block mb-2">Mobile Number</label>
      <input id="mobile" type="text" class="w-full border p-2 rounded mb-2"/>
      <label class="block mb-2">Email (readonly)</label>
      <input id="email" type="text" readonly class="w-full border p-2 rounded mb-2 bg-gray-100"/>
      <button onclick="saveProfile()" class="w-full bg-blue-600 text-white p-2 rounded">Save Profile</button>
    </div>

    <div class="bg-white shadow-md rounded-lg p-4 mb-4">
      <h2 class="text-lg font-semibold mb-2">Profile Image</h2>
      <img id="profileImg" src="https://via.placeholder.com/100" class="w-24 h-24 rounded-full mb-2"/>
      <input id="profileFile" type="file" class="mb-2"/>
      <button onclick="uploadProfile()" class="bg-green-600 text-white px-4 py-2 rounded">Upload</button>
    </div>

    <div class="bg-white shadow-md rounded-lg p-4 mb-4">
      <h2 class="text-lg font-semibold mb-2">QR Code</h2>
      <img id="qrImg" src="https://via.placeholder.com/150" class="w-32 h-32 mb-2"/>
      <input id="qrFile" type="file" class="mb-2"/>
      <button onclick="uploadQR()" class="bg-green-600 text-white px-4 py-2 rounded">Upload</button>
    </div>

    <div class="bg-white shadow-md rounded-lg p-4 mb-4">
      <h2 class="text-lg font-semibold mb-2">Banner Image</h2>
      <img id="bannerImg" src="https://via.placeholder.com/300x100" class="w-full mb-2"/>
      <input id="bannerFile" type="file" class="mb-2"/>
      <button onclick="uploadBanner()" class="bg-green-600 text-white px-4 py-2 rounded">Upload</button>
    </div>

    <p id="msg" class="text-sm mt-2"></p>
    <p class="mt-4 text-sm text-center"><a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a></p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mobile Recharge</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-md mx-auto bg-white shadow-lg rounded-lg p-6 mt-10">
    <h1 class="text-2xl font-bold text-blue-700 mb-4 text-center">📱 Mobile Recharge</h1>

    <label class="block mb-2 font-semibold">Mobile Number</label>
    <input id="mobile" type="text" maxlength="10" placeholder="Enter mobile number" 
      class="w-full border rounded p-2 mb-4"/>

    <label class="block mb-2 font-semibold">Operator</label>
    <select id="operator" class="w-full border rounded p-2 mb-4">
      <option value="">-- Select Operator --</option>
      <option value="A">Airtel</option>
      <option value="V">VI (Vodafone Idea)</option>
      <option value="BT">BSNL Topup</option>
      <option value="BR">BSNL STV</option>
      <option value="RC">Jio</option>
    </select>

    <label class="block mb-2 font-semibold">Amount</label>
    <input id="amount" type="number" placeholder="Enter amount" 
      class="w-full border rounded p-2 mb-4"/>

    <button onclick="doRecharge()" 
      class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Recharge Now</button>

    <p id="msg" class="mt-4 text-center font-semibold"></p>

    <p class="mt-6 text-center text-sm">
      <a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a>
    </p>
  </div>

  <script>
    async function doRecharge() {
      const number = document.getElementById("mobile").value.trim();
      const opcode = document.getElementById("operator").value;
      const amount = document.getElementById("amount").value.trim();
      const msg = document.getElementById("msg");
      msg.textContent = "Processing...";

      if (!number || !opcode || !amount) {
        msg.textContent = "⚠️ Please fill all fields!";
        return;
      }

      // unique orderid
      const orderid = "ORD" + Date.now();

      const url = `https://myrc.in/v3/recharge/api?username=501903&token=d25e1910be6a5d20780a7dd2f7ce796f&opcode=${opcode}&number=${number}&amount=${amount}&orderid=${orderid}&format=json`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        console.log(data);

        if (data.status === "Success") {
          msg.textContent = "✅ Recharge Successful! TxID: " + data.txid;
          msg.className = "mt-4 text-green-600 font-bold text-center";
        } else if (data.status === "Pending") {
          msg.textContent = "⏳ Recharge Pending... Please wait";
          msg.className = "mt-4 text-yellow-600 font-bold text-center";
        } else {
          msg.textContent = "❌ Failed: " + data.message;
          msg.className = "mt-4 text-red-600 font-bold text-center";
        }
      } catch (e) {
        msg.textContent = "❌ API Error: " + e.message;
        msg.className = "mt-4 text-red-600 font-bold text-center";
      }
    }
  </script>

</body>
</html>

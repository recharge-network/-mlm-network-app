<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apna Subsidy Recharge</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #f9f9f9;
    }
    h1 {
      color: #2196F3;
    }
    form {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select, button {
      padding: 10px;
      width: 90%;
      margin: 10px 0;
      font-size: 16px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #msg {
      margin-top: 15px;
      font-weight: bold;
    }
    /* Spinner style */
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #fff;
      border-right: 3px solid #4CAF50;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-left: 8px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>Apna Subsidy Recharge</h1>
  <form id="rechargeForm">
    <input type="text" id="mobile" placeholder="मोबाइल नंबर" required><br>
    <select id="operator" required>
      <option value="">ऑपरेटर चुनें</option>
      <option value="1">Airtel</option>
      <option value="2">Vodafone Idea</option>
      <option value="3">BSNL</option>
      <option value="4">Jio</option>
    </select><br>
    <input type="number" id="amount" placeholder="राशि" required><br>
    <button type="submit" id="btnRecharge">
      रिचार्ज करें
      <span id="spinner" class="spinner" style="display:none;"></span>
    </button>
    <div id="msg"></div>
  </form>

  <script>
    const API_TOKEN = "1223f98a-dc6f-449c-81e2-1bca07bfc54e"; // Aapka Mrobotic Token

    document.getElementById("rechargeForm").addEventListener("submit", async function(e){
      e.preventDefault();

      const mobile = document.getElementById("mobile").value.trim();
      const operator = document.getElementById("operator").value;
      const amount = document.getElementById("amount").value.trim();
      const msg = document.getElementById("msg");
      const spinner = document.getElementById("spinner");
      const btn = document.getElementById("btnRecharge");

      if(!mobile || !operator || !amount){
        msg.textContent = "⚠️ सभी विवरण भरें";
        msg.style.color = "red";
        return;
      }

      // Show spinner + disable button
      spinner.style.display = "inline-block";
      btn.disabled = true;
      msg.textContent = "⏳ Processing recharge...";
      msg.style.color = "blue";

      const orderid = "ORD" + Date.now();

      const url = https://mrobotics.in/api/recharge_get?api_token=${API_TOKEN}&mobile_no=${mobile}&amount=${amount}&company_id=${operator}&order_id=${orderid}&is_stv=false;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.status && data.status.toLowerCase() === "success") {
          msg.textContent = "✅ Recharge Successful! TxID: " + data.tnx_id;
          msg.style.color = "green";
        } else if (data.status && data.status.toLowerCase() === "pending") {
          msg.textContent = "⏳ Recharge Pending... TxID: " + data.tnx_id;
          msg.style.color = "orange";
        } else {
          msg.textContent = "❌ Failed: " + (data.response || "Unknown error");
          msg.style.color = "red";
        }
      } catch(err) {
        msg.textContent = "⚠️ Error: " + err.message;
        msg.style.color = "red";
      }

      // Hide spinner + enable button again
      spinner.style.display = "none";
      btn.disabled = false;
    });
  </script>
</body>
</html>

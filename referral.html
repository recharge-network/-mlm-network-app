<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Referral System</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs, query, where, setDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // 🔗 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.appspot.com",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser;

    onAuthStateChanged(auth, async (user) => {
      if (!user) return (window.location.href = "login.html");
      currentUser = user;
      document.getElementById("refLink").value = window.location.origin + "/signup.html?ref=" + user.uid;
      loadReferrals();
    });

    // 🔹 Load My Referrals
    async function loadReferrals() {
      const tbody = document.getElementById("refBody");
      tbody.innerHTML = `<tr><td colspan="3" class="p-3 text-center">Loading...</td></tr>`;

      try {
        const q = query(collection(db, "users"), where("refBy", "==", currentUser.uid));
        const snap = await getDocs(q);
        tbody.innerHTML = "";
        if (snap.empty) {
          tbody.innerHTML = `<tr><td colspan="3" class="p-3 text-center">No referrals yet</td></tr>`;
          return;
        }
        let i = 1;
        snap.forEach(docu => {
          const d = docu.data();
          tbody.innerHTML += `
            <tr class="hover:bg-gray-50">
              <td class="border p-2">${i++}</td>
              <td class="border p-2">${d.name || "User"}</td>
              <td class="border p-2">${d.email || ""}</td>
            </tr>`;
        });
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-3 text-red-600">Error: ${e.message}</td></tr>`;
      }
    }

    // 🔹 Copy Referral Link
    window.copyLink = () => {
      const link = document.getElementById("refLink");
      link.select();
      document.execCommand("copy");
      alert("✅ Referral link copied!");
    };
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">👥 My Referrals</h1>

    <!-- Referral Link -->
    <div class="bg-white shadow rounded p-4 mb-4">
      <label class="block font-semibold mb-2">Your Referral Link</label>
      <div class="flex">
        <input id="refLink" type="text" readonly class="flex-1 border p-2 rounded-l"/>
        <button onclick="copyLink()" class="bg-blue-600 text-white px-4 rounded-r">Copy</button>
      </div>
    </div>

    <!-- Referral List -->
    <div class="bg-white shadow rounded overflow-hidden">
      <table class="w-full border-collapse">
        <thead class="bg-gray-200">
          <tr>
            <th class="border p-2">#</th>
            <th class="border p-2">Name</th>
            <th class="border p-2">Email</th>
          </tr>
        </thead>
        <tbody id="refBody"></tbody>
      </table>
    </div>

    <p class="mt-4 text-sm text-center">
      <a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a>
    </p>
  </div>
</body>
</html>

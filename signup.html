<!DOCTYPE html>
<html>
<head>
  <title>Signup</title>
</head>
<body>
  <h2>Signup</h2>
  <input type="email" id="email" placeholder="Enter email"><br>
  <input type="password" id="password" placeholder="Enter password"><br>
  <button onclick="signup()">Sign Up</button>

  <p id="status"></p>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-firestore-compat.js"></script>

  <!-- Config -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <!-- Signup Logic -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const referralBy = urlParams.get('ref') || null;

    function signup() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      auth.createUserWithEmailAndPassword(email, password)
        .then(async (userCredential) => {
          const user = userCredential.user;

          await db.collection("users").doc(user.uid).set({
            uid: user.uid,
            email: user.email,
            referralBy: referralBy,
            wallet: 0,
            createdAt: new Date()
          });

          document.getElementById("status").innerText = "Signup successful!";
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          document.getElementById("status").innerText = error.message;
        });
    }
  </script>
</body>
</html>

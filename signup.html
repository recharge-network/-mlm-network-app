<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // 🔗 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.appspot.com",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ✅ Referral ID from URL (if any)
    const urlParams = new URLSearchParams(window.location.search);
    const refBy = urlParams.get("ref") || null;

    window.signup = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const msg = document.getElementById("msg");
      msg.textContent = "";

      if (!name || !email || !password) {
        msg.textContent = "⚠️ Please fill all required fields";
        return;
      }

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const user = cred.user;

        // Save user data in Firestore
        await setDoc(doc(db, "users", user.uid), {
          name,
          phone,
          email,
          balance: 0,
          refBy: refBy,   // save referral UID if available
          createdAt: new Date()
        });

        msg.textContent = "✅ Signup successful! Redirecting...";
        setTimeout(() => window.location.href = "index.html", 1500);
      } catch (e) {
        msg.textContent = "❌ " + e.message;
      }
    };
  </script>
</head>
<body class="bg-gradient-to-r from-blue-500 to-purple-600 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-blue-700 mb-6">📝 Sign Up</h1>
    
    <input id="name" type="text" placeholder="Full Name" class="w-full border p-2 rounded mb-3"/>
    <input id="phone" type="text" placeholder="Phone Number" class="w-full border p-2 rounded mb-3"/>
    <input id="email" type="email" placeholder="Email" class="w-full border p-2 rounded mb-3"/>
    <input id="password" type="password" placeholder="Password" class="w-full border p-2 rounded mb-3"/>
    
    <button onclick="signup()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Sign Up</button>
    <p id="msg" class="text-sm mt-3 text-center text-red-600"></p>
    
    <p class="mt-4 text-sm text-center">
      Already have an account? <a href="login.html" class="text-blue-600">Login</a>
    </p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // ✅ आपका Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Signup Function
    window.doSignup = async () => {
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      const msg = document.getElementById("msg");
      msg.textContent = "";

      if (!email || !pass) {
        msg.textContent = "⚠️ Please fill all fields.";
        return;
      }

      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, pass);
        const uid = userCred.user.uid;

        // Save user info in Firestore
        await setDoc(doc(db, "users", uid), {
          email: email,
          balance: 0,
          createdAt: new Date()
        });

        msg.textContent = "✅ Signup successful! Redirecting...";
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);
      } catch (e) {
        msg.textContent = "❌ " + e.message;
      }
    };
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">Create Account</h1>
    <div class="bg-white shadow-md rounded-lg p-4">
      <input id="email" type="email" placeholder="Email" class="w-full border p-2 rounded mb-2"/>
      <input id="password" type="password" placeholder="Password" class="w-full border p-2 rounded mb-2"/>
      <button onclick="doSignup()" class="w-full bg-blue-600 text-white p-2 rounded">Sign Up</button>
      <p id="msg" class="text-sm mt-2"></p>
    </div>
    <p class="mt-4 text-sm text-center">
      Already have an account? <a href="login.html" class="text-blue-600">Login</a>
    </p>
  </div>
</body>
</html>

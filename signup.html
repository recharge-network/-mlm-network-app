<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    // 🔹 Aapka Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 🔹 Reset Password Function
    window.doReset = async () => {
      const email = document.getElementById("email").value;
      if (!email) {
        document.getElementById("msg").textContent = "⚠️ Please enter your email.";
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        document.getElementById("msg").textContent = "✅ Reset link sent to " + email;
        document.getElementById("msg").className = "text-green-600 text-sm mt-2";
      } catch (err) {
        document.getElementById("msg").textContent = err.message;
        document.getElementById("msg").className = "text-red-500 text-sm mt-2";
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-sm">
    <h2 class="text-xl font-bold text-center mb-4">Forgot Password</h2>
    <input id="email" type="email" placeholder="Enter your Email" class="w-full border p-2 rounded mb-2" />
    <button onclick="doReset()" class="w-full bg-blue-600 text-white p-2 rounded">Send Reset Link</button>
    <p id="msg" class="text-sm mt-2"></p>
    <p class="mt-4 text-sm text-center">Back to <a href="login.html" class="text-blue-600">Login</a></p>
  </div>
</body>
</html>

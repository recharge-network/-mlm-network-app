<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quick Transaction</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // ✅ आपका Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser;

    // user login check
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        currentUser = user;
        document.getElementById("welcome").textContent = "Welcome, " + (user.email || "");
      }
    });

    // transaction submit
    window.quickTxn = async () => {
      const type = document.getElementById("type").value;
      const ref = document.getElementById("ref").value.trim();
      const amount = parseFloat(document.getElementById("amount").value);
      const msg = document.getElementById("msg");
      msg.textContent = "";

      if (!type || !ref || isNaN(amount) || amount <= 0) {
        msg.textContent = "⚠️ Fill all fields properly.";
        return;
      }

      try {
        const userRef = doc(db, "users", currentUser.uid);
        const snap = await getDoc(userRef);
        const bal = snap.exists() ? (snap.data().balance || 0) : 0;

        if (bal < amount) {
          msg.textContent = "❌ Insufficient balance.";
          return;
        }

        // balance update
        await updateDoc(userRef, { balance: increment(-amount) });

        // ledger entry
        await addDoc(collection(db, "users", currentUser.uid, "ledger"), {
          type: type,
          amount: amount,
          note: ref,
          status: "Success",
          ts: serverTimestamp()
        });

        msg.textContent = "✅ Transaction successful & saved to ledger.";
        document.getElementById("ref").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("type").selectedIndex = 0;

      } catch (e) {
        msg.textContent = "❌ Error: " + e.message;
      }
    };
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">Quick Transaction</h1>
    <p id="welcome" class="text-sm text-gray-600 mb-2"></p>
    <div class="bg-white shadow-md rounded-lg p-4">
      <select id="type" class="w-full border p-2 rounded mb-2">
        <option value="">Select Type</option>
        <option value="Recharge">📱 Recharge</option>
        <option value="Bill">🧾 Bill Payment</option>
        <option value="DTH">📺 DTH</option>
        <option value="AEPS">🆔 AEPS</option>
        <option value="Money Transfer">🏦 Money Transfer</option>
        <option value="Wallet Transfer">👛 Wallet Transfer</option>
      </select>
      <input id="ref" type="text" placeholder="Reference (e.g., Mobile No, Account No, etc.)" class="w-full border p-2 rounded mb-2"/>
      <input id="amount" type="number" placeholder="Amount" class="w-full border p-2 rounded mb-2"/>
      <button onclick="quickTxn()" class="w-full bg-blue-600 text-white p-2 rounded">Submit</button>
      <p id="msg" class="text-sm mt-2"></p>
    </div>

    <p class="mt-4 text-sm text-center">
      <a href="ledger.html" class="text-blue-600">📒 View Ledger</a> | 
      <a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a>
    </p>
  </div>
</body>
</html>

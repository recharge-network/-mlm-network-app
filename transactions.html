<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Ledger - Admin View</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, collection, getDocs, orderBy, query, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ✅ Admin UID
    let adminUID = "0WU4cP36N1Zw9lLiT6igc2jwY523";

    let targetUserId;

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = "login.html";
      if (user.uid !== adminUID) return window.location.href = "index.html"; // केवल admin access कर सके

      targetUserId = localStorage.getItem("ledgerUser");
      if (!targetUserId) {
        document.getElementById("info").textContent = "⚠️ No user selected.";
        return;
      }

      loadUserInfo(targetUserId);
      loadLedger(targetUserId);
    });

    async function loadUserInfo(uid) {
      const snap = await getDoc(doc(db, "users", uid));
      if (snap.exists()) {
        const d = snap.data();
        document.getElementById("info").textContent = `📒 Ledger for: ${d.name || d.email || uid} (Balance: ₹ ${(d.balance || 0).toFixed(2)})`;
      }
    }

    async function loadLedger(uid) {
      const tbody = document.getElementById("ledgerBody");
      tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center">Loading...</td></tr>`;
      try {
        const q = query(collection(db, "users", uid, "ledger"), orderBy("ts", "desc"));
        const snap = await getDocs(q);
        tbody.innerHTML = "";
        if (snap.empty) {
          tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center">No transactions found</td></tr>`;
          return;
        }
        snap.forEach(docu => {
          const d = docu.data();
          const date = d.ts?.toDate().toLocaleString() || "";
          tbody.innerHTML += `
            <tr>
              <td class="border p-2">${date}</td>
              <td class="border p-2">${d.type || ""}</td>
              <td class="border p-2">₹ ${(+d.amount || 0).toFixed(2)}</td>
              <td class="border p-2">${d.note || ""}</td>
              <td class="border p-2">${d.status || "Success"}</td>
            </tr>`;
        });
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-red-600">Error: ${e.message}</td></tr>`;
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">👑 Admin - User Ledger</h1>
    <p id="info" class="mb-4 text-gray-700"></p>
    <div class="bg-white shadow rounded overflow-hidden">
      <table class="w-full border-collapse">
        <thead class="bg-gray-200">
          <tr>
            <th class="border p-2">Date</th>
            <th class="border p-2">Type</th>
            <th class="border p-2">Amount</th>
            <th class="border p-2">Note</th>
            <th class="border p-2">Status</th>
          </tr>
        </thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </div>
    <p class="mt-4 text-sm text-center">
      <a href="admin.html" class="text-blue-600">⬅ Back to Admin Panel</a>
    </p>
  </div>
</body>
</html>

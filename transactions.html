<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transactions</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // 🔹 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 🔹 Auth Guard
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        loadTransactions(user.uid);
      }
    });

    // 🔹 Load Transactions
    function loadTransactions(uid) {
      const tbody = document.getElementById("ledgerBody");
      tbody.innerHTML = "<tr><td colspan='4' class='text-center p-2'>Loading...</td></tr>";

      const q = query(
        collection(db, "users", uid, "ledger"),
        orderBy("ts", "desc")
      );

      onSnapshot(q, (snapshot) => {
        tbody.innerHTML = "";
        if (snapshot.empty) {
          tbody.innerHTML = "<tr><td colspan='4' class='text-center p-2'>No transactions found</td></tr>";
          return;
        }
        snapshot.forEach((doc) => {
          const t = doc.data();
          const row = `<tr class="border-b">
            <td class="p-2">${t.ts?.toDate ? t.ts.toDate().toLocaleString() : ""}</td>
            <td class="p-2">${t.type || ""}</td>
            <td class="p-2 font-semibold ${t.type==='credit'?'text-green-600':'text-red-600'}">₹${t.amount}</td>
            <td class="p-2">${t.note || ""}</td>
          </tr>`;
          tbody.insertAdjacentHTML("beforeend", row);
        });
      });
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">Your Transactions</h1>
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-200">
          <tr>
            <th class="p-2 text-left">Date & Time</th>
            <th class="p-2 text-left">Type</th>
            <th class="p-2 text-left">Amount</th>
            <th class="p-2 text-left">Note</th>
          </tr>
        </thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </div>
    <p class="mt-4 text-sm text-center"><a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a></p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // 🔹 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser;

    // 🔹 Auth Guard
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        currentUser = user;
        loadBalance(user.uid);
      }
    });

    // 🔹 Load Balance
    async function loadBalance(uid) {
      const snap = await getDoc(doc(db, "users", uid));
      if (snap.exists()) {
        document.getElementById("balance").textContent = "₹" + (snap.data().balance || 0);
      }
    }

    // 🔹 Transfer Money
    window.doTransfer = async () => {
      const targetUid = document.getElementById("targetUid").value.trim();
      const amount = parseFloat(document.getElementById("amount").value);

      if (!targetUid || isNaN(amount) || amount <= 0) {
        document.getElementById("msg").textContent = "⚠️ Please enter valid UID and amount.";
        return;
      }

      if (!currentUser) return;

      try {
        const senderRef = doc(db, "users", currentUser.uid);
        const receiverRef = doc(db, "users", targetUid);

        const senderSnap = await getDoc(senderRef);
        if (!senderSnap.exists() || senderSnap.data().balance < amount) {
          document.getElementById("msg").textContent = "❌ Insufficient balance.";
          return;
        }

        // Transaction
        await updateDoc(senderRef, { balance: increment(-amount) });
        await updateDoc(receiverRef, { balance: increment(amount) });

        // Ledger entry for sender
        await addDoc(collection(db, "users", currentUser.uid, "ledger"), {
          type: "debit",
          amount,
          note: "Transfer to " + targetUid,
          ts: serverTimestamp()
        });

        // Ledger entry for receiver
        await addDoc(collection(db, "users", targetUid, "ledger"), {
          type: "credit",
          amount,
          note: "Received from " + currentUser.uid,
          ts: serverTimestamp()
        });

        document.getElementById("msg").textContent = "✅ Transfer successful!";
        loadBalance(currentUser.uid);
      } catch (err) {
        document.getElementById("msg").textContent = "❌ " + err.message;
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">My Wallet</h1>
    <div class="bg-white shadow-md rounded-lg p-4 mb-4">
      <p class="text-lg">Current Balance:</p>
      <p id="balance" class="text-2xl font-bold text-green-600">₹0</p>
    </div>

    <div class="bg-white shadow-md rounded-lg p-4">
      <h2 class="text-lg font-semibold mb-2">Wallet to Wallet Transfer</h2>
      <input id="targetUid" type="text" placeholder="Receiver UID" class="w-full border p-2 rounded mb-2"/>
      <input id="amount" type="number" placeholder="Amount" class="w-full border p-2 rounded mb-2"/>
      <button onclick="doTransfer()" class="w-full bg-blue-600 text-white p-2 rounded">Transfer</button>
      <p id="msg" class="text-sm mt-2"></p>
    </div>

    <p class="mt-4 text-sm text-center"><a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a></p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // 🔗 Firebase config (आपका)
    const firebaseConfig = {
      apiKey: "AIzaSyA9KS6E7oWd2aNumYPRkTpCvl_Sqb1TZtE",
      authDomain: "mlm-network-157e8.firebaseapp.com",
      projectId: "mlm-network-157e8",
      storageBucket: "mlm-network-157e8.firebasestorage.app",
      messagingSenderId: "433192039581",
      appId: "1:433192039581:web:42d02b965870e4a8969074"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser;

    onAuthStateChanged(auth, async (user) => {
      if (!user) return (window.location.href = "login.html");
      currentUser = user;
      loadBalance();
    });

    async function loadBalance() {
      const snap = await getDoc(doc(db, "users", currentUser.uid));
      const bal = snap.exists() ? (snap.data().balance || 0) : 0;
      document.getElementById("balance").textContent = "₹ " + bal.toFixed(2);
    }

    // 💰 Add Money (demo mode)
    window.addMoney = async () => {
      const amount = parseFloat(document.getElementById("addAmount").value);
      const msg = document.getElementById("msg");
      msg.textContent = "";

      if (isNaN(amount) || amount <= 0) return (msg.textContent = "⚠️ Enter valid amount");

      try {
        const userRef = doc(db, "users", currentUser.uid);
        await updateDoc(userRef, { balance: increment(amount) });
        await addDoc(collection(db, "users", currentUser.uid, "ledger"), {
          type: "Credit",
          amount: amount,
          note: "Wallet Add Money (demo)",
          status: "Success",
          ts: serverTimestamp()
        });
        msg.textContent = "✅ Money added successfully!";
        document.getElementById("addAmount").value = "";
        loadBalance();
      } catch (e) {
        msg.textContent = "❌ " + e.message;
      }
    };
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-4">💼 My Wallet</h1>

    <div class="bg-white shadow rounded p-4 mb-4">
      <h2 class="text-lg font-semibold">Current Balance</h2>
      <p id="balance" class="text-2xl text-green-600">₹ 0.00</p>
    </div>

    <div class="bg-white shadow rounded p-4">
      <h2 class="text-lg font-bold mb-2">💰 Add Money</h2>
      <input id="addAmount" type="number" placeholder="Enter amount" class="w-full border p-2 rounded mb-2"/>
      <button onclick="addMoney()" class="w-full bg-green-600 text-white p-2 rounded">Add Money</button>
      <p id="msg" class="text-sm mt-2"></p>
    </div>

    <p class="mt-4 text-sm text-center">
      <a href="ledger.html" class="text-blue-600">📒 View Ledger</a> |
      <a href="index.html" class="text-blue-600">⬅ Back to Dashboard</a>
    </p>
  </div>
</body>
</html>
